[package]
name = "veloce-controller"
version = "1.0.0-beta.2"
edition = "2021"

[dependencies]
veloce-common = { path = "../common" }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
anyhow = "1.0"
bytes = "1.0"
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
dashmap = "5.0"
log = "0.4"
env_logger = "0.10"
serde_json = "1.0"
gethostname = "0.5"
toml = "0.8"
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
axum = { version = "0.7", features = ["macros", "ws", "multipart"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
snow = "0.10.0"
base64 = "0.22.1"
clap = { version = "4.0", features = ["derive", "env"] }
opentelemetry = { version = "0.21" }
opentelemetry_sdk = { version = "0.21", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.14", features = ["grpc-tonic", "tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.22"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
chrono = "0.4"
regex = "1.10"
uuid = { version = "1.0", features = ["v4"] }
tracing-appender = "0.2.5"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "postgres", "any"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
native-tls = "0.2"
urlencoding = "2.1.3"
subtle = "2.5"
sha2 = "0.10"
aes-gcm = "0.10"
jsonwebtoken = "10.3"

[features]
insecure-query-auth = []
production = ["veloce-common/production"]

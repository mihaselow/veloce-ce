name: veloce-worker
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Michael Haselow <hello@veloce-hpc.io>
description: Veloce worker
vendor: Veloce
license: Business Source License 1.1
contents:
  - src: ./build/stage/veloce-worker/usr/bin/veloce-worker
    dst: /usr/bin/veloce-worker
    file_info:
      mode: 0755
  - src: ./build/stage/veloce-worker/etc/veloce/veloce-worker.toml.example
    dst: /etc/veloce/veloce-worker.toml.example
    file_info:
      mode: 0644
    type: config|noreplace
  - src: ./build/stage/veloce-worker/lib/systemd/system/veloce-worker.service
    dst: /lib/systemd/system/veloce-worker.service
    file_info:
      mode: 0644

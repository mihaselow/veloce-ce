version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
      aws-sdk:
        patterns:
          - "aws-*"
    ignore:
      # Majors in this stack are routinely API-incompatible (axum 0.8, leptos 0.7, sqlx 0.9, …).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # No patched rsa 0.9.x for Marvin; pulled in by jsonwebtoken.
      - dependency-name: rsa
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

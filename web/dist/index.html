    <script>
      window.veloceTerminal = {
        sessions: {},
        init: function(elementId, jobId, ticket) {
          if (this.sessions[elementId]) {
            this.sessions[elementId].destroy();
          }

          const container = document.getElementById(elementId);
          if (!container) return;

          const term = new Terminal({
            cursorBlink: true,
            theme: {
              background: '#0d1117',
              foreground: '#c9d1d9',
              cursor: '#38bdf8',
            },
            fontFamily: "'JetBrains Mono', 'Fira Code', monospace",
            fontSize: 13,
          });

          const fitAddon = new FitAddon.FitAddon();
          term.loadAddon(fitAddon);
          term.open(container);
          fitAddon.fit();

          term.write("Connecting to secure Veloce TTY...\r\n");

          const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
          const wsUrl = `${protocol}//${window.location.host}/api/v1/jobs/${jobId}/terminal?ticket=${encodeURIComponent(ticket)}`;
          
          const ws = new WebSocket(wsUrl);
          ws.binaryType = 'arraybuffer';

          ws.onopen = () => {
            term.write("\x1b[2K\rConnected! Spawning shell...\r\n");
            ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
          };

          ws.onmessage = (event) => {
            if (event.data instanceof ArrayBuffer) {
              term.write(new Uint8Array(event.data));
            } else {
              term.write(event.data);
            }
          };

          ws.onclose = () => {
            term.write("\r\nSession closed.\r\n");
          };

          ws.onerror = () => {
            term.write("\r\nConnection error.\r\n");
          };

          term.onData((data) => {
            if (ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ type: 'input', data: data }));
            }
          });

          const resizeObserver = new ResizeObserver(() => {
            try {
              fitAddon.fit();
              if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
              }
            } catch (e) {
              console.error(e);
            }
          });
          resizeObserver.observe(container);

          this.sessions[elementId] = {
            destroy: () => {
              resizeObserver.disconnect();
              try { ws.close(); } catch(e){}
              try { term.dispose(); } catch(e){}
              delete this.sessions[elementId];
            }
          };
        },
        destroy: function(elementId) {
          if (this.sessions[elementId]) {
            this.sessions[elementId].destroy();
          }
        }
      };
    </script>
    <script>
      window.veloceVnc = {
        sessions: {},
        init: async function(elementId, jobId, ticket, retryCount = 0) {
          if (this.sessions[elementId]) {
            this.sessions[elementId].destroy();
          }

          const container = document.getElementById(elementId);
          if (!container) {
             if (retryCount < 10) {
               setTimeout(() => this.init(elementId, jobId, ticket, retryCount + 1), 100);
             }
             return;
          }

          const token = Symbol(elementId);
          const clearVncChildren = () => {
            Array.from(container.children).forEach((child) => {
              if (!child.classList.contains('vnc-placeholder')) {
                child.remove();
              }
            });
          };

          clearVncChildren();
          this.sessions[elementId] = {
            token,
            destroy: () => {
              clearVncChildren();
              const placeholder = container.querySelector('.vnc-placeholder');
              if (placeholder) {
                placeholder.style.display = 'flex';
              }
              if (this.sessions[elementId]?.token === token) {
                delete this.sessions[elementId];
              }
            }
          };

          try {
            // Dynamic import to avoid race conditions with module loading
            const { default: RFB } = await import('https://cdn.jsdelivr.net/gh/novnc/noVNC@v1.5.0/core/rfb.js');

            if (this.sessions[elementId]?.token !== token) {
              return;
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/api/v1/jobs/${jobId}/vnc?ticket=${encodeURIComponent(ticket)}`;

            const resizeToContainer = elementId.includes('fullscreen');
            const rfb = new RFB(container, wsUrl, {
              wsProtocols: ['binary']
            });
            
            rfb.scaleViewport = !resizeToContainer;
            rfb.clipViewport = resizeToContainer;
            rfb.resizeSession = true;

            rfb.addEventListener('connect', () => {
               console.log("VNC Connected to job " + jobId);
               const placeholder = container.querySelector('.vnc-placeholder');
               if (placeholder) {
                 placeholder.style.display = 'none';
               }
            });

            rfb.addEventListener('disconnect', (e) => {
               console.log("VNC Disconnected from job " + jobId, e.detail.clean);
               const placeholder = container.querySelector('.vnc-placeholder');
               if (placeholder) {
                 placeholder.style.display = 'flex';
                 placeholder.innerHTML = `
                   <i class="ph ph-warning" style="font-size: 2rem; color: var(--danger);"></i>
                   <span>VNC Connection Disconnected</span>
                 `;
               }
            });

            this.sessions[elementId] = {
              token,
              destroy: () => {
                try { rfb.disconnect(); } catch(e){}
                clearVncChildren();
                const placeholder = container.querySelector('.vnc-placeholder');
                if (placeholder) {
                  placeholder.style.display = 'flex';
                }
                if (this.sessions[elementId]?.token === token) {
                  delete this.sessions[elementId];
                }
              }
            };
          } catch (e) {
            console.error("Failed to load noVNC:", e);
            if (this.sessions[elementId]?.token === token) {
              delete this.sessions[elementId];
            }
          }
        },
        destroy: function(elementId) {
          if (this.sessions[elementId]) {
            this.sessions[elementId].destroy();
          }
        }
      };
    </script>
